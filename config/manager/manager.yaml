apiVersion: apps/v1
kind: Deployment
metadata:
  name: curvine-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: curvine-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curvine-operator
    spec:
      serviceAccountName: curvine-operator
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: curvine-operator:dev
          imagePullPolicy: IfNotPresent
          args: ["--leader-elect=true"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
