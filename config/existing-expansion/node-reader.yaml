apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: curvine-expansion-node-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: curvine-expansion-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: curvine-expansion-node-reader
subjects:
  - kind: ServiceAccount
    name: curvine-operator
    namespace: curvine-system
