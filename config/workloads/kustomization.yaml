apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: curvine-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --workload-contract=curvine-728d2a46
