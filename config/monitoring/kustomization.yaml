apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../workloads
  - service.yaml
patches:
  - target:
      kind: Deployment
      name: curvine-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --metrics-bind-address=:8080
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: metrics
          containerPort: 8080
