name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make check build
      - run: make generate && git diff --exit-code -- api/v1alpha1/zz_generated.deepcopy.go config/crd/bases
      - run: make test-envtest
        env:
          ENVTEST_DOWNLOAD: "1"
      - run: bin/curvine-operator validate --file examples/cluster-development.json
      - run: bin/curvine-operator plan --file examples/cluster-production.json
